name: data

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install huggingface-hub==2.4.0
      - run: python scripts/prepare_data.py --out data
      - name: Commit the dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "dataset unchanged"; exit 0; }
          git commit -m "Dataset from FiNER-139 (data workflow run ${{ github.run_id }})"
          git push
