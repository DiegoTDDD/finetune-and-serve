name: data

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install huggingface-hub==2.4.0
      - run: python scripts/prepare_data.py --out data
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
