[project]
name = "finetune-and-serve"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
# The pip-audit script is shared unchanged by every repository's security workflow.
extend-exclude = [".github/scripts"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ftserve"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
